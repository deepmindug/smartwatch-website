  <!-- satellite -->
  <g transform="translate(1520 120) rotate(30)">
    <rect x="-14" y="-14" width="28" height="28" rx="6" fill="#111111"/>
    <rect x="-64" y="-10" width="40" height="20" rx="3" fill="#00AD4E"/>
    <rect x="24" y="-10" width="40" height="20" rx="3" fill="#00AD4E"/>
    <path d="M-44 -10 L-44 10 M44 -10 L44 10" stroke="#FFFFFF" stroke-width="2"/>
    <circle cy="22" r="6" fill="#111111"/>
