<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3FBF6"/>
      <stop offset="1" stop-color="#E6F4EC"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#00AD4E" opacity="0.10"/>
    </pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="16" result="b"/>
      <feFlood flood-color="#111111" flood-opacity="0.12"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shs" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dy="8" result="b"/>
      <feFlood flood-color="#111111" flood-opacity="0.16"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="mapClip"><rect x="120" y="170" width="900" height="760" rx="36"/></clipPath>
    <linearGradient id="routeG" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#111111"/>
      <stop offset="0.35" stop-color="#00AD4E"/>
      <stop offset="1" stop-color="#00AD4E"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect width="1600" height="1200" fill="url(#dots)"/>
  <circle cx="1450" cy="160" r="260" fill="#00AD4E" opacity="0.06"/>
  <circle cx="110" cy="1120" r="220" fill="#00AD4E" opacity="0.07"/>

  <!-- ============ MAP CARD ============ -->
  <g filter="url(#sh)">
    <rect x="120" y="170" width="900" height="760" rx="36" fill="#FFFFFF"/>
  </g>
  <g clip-path="url(#mapClip)">
    <rect x="120" y="170" width="900" height="760" fill="#F7F9F8"/>
    <!-- water -->
    <path d="M120 930 L120 760 C200 740 260 790 320 840 C380 890 420 900 470 930 Z" fill="#DCEBF7"/>
    <!-- parks -->
    <path d="M560 210 C640 190 720 220 700 290 C690 340 600 350 560 320 C520 290 510 230 560 210 Z" fill="#D7F1E1"/>
    <path d="M780 700 C850 670 960 690 980 760 C1000 830 900 870 830 850 C770 830 730 730 780 700 Z" fill="#D7F1E1"/>
    <path d="M170 300 C230 270 320 300 300 360 C280 410 190 410 170 370 Z" fill="#D7F1E1"/>
    <!-- blocks -->
    <g fill="#ECEFEE">
      <rect x="350" y="220" width="150" height="110" rx="10"/>
      <rect x="760" y="210" width="110" height="80" rx="10"/>
      <rect x="180" y="460" width="140" height="120" rx="10"/>
      <rect x="560" y="420" width="120" height="100" rx="10"/>
      <rect x="380" y="430" width="120" height="90" rx="10"/>
      <rect x="600" y="780" width="140" height="110" rx="10"/>
      <rect x="880" y="420" width="110" height="160" rx="10"/>
      <rect x="560" y="610" width="160" height="110" rx="10"/>
    </g>
    <!-- roads -->
    <g stroke="#FFFFFF" stroke-width="26" fill="none" stroke-linecap="round">
      <path d="M120 400 L1020 380"/>
      <path d="M120 690 L1020 560"/>
      <path d="M340 170 L360 930"/>
      <path d="M530 170 L540 930"/>
      <path d="M740 170 L760 930"/>
      <path d="M120 230 C400 600 700 300 1020 720"/>
    </g>
    <g stroke="#E1E6E4" stroke-width="2" fill="none">
      <path d="M120 400 L1020 380" stroke-dasharray="14 14"/>
      <path d="M120 690 L1020 560" stroke-dasharray="14 14"/>
    </g>

    <!-- travelled route -->
    <path d="M230 820 C320 760 400 760 470 640 C530 540 620 470 730 470 C840 470 880 380 900 290"
          stroke="#00AD4E" stroke-opacity="0.18" stroke-width="30" fill="none" stroke-linecap="round"/>
    <path d="M230 820 C320 760 400 760 470 640 C530 540 620 470 730 470 C840 470 880 380 900 290"
          stroke="url(#routeG)" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M230 820 C320 760 400 760 470 640 C530 540 620 470 730 470 C840 470 880 380 900 290"
          stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="2 18"/>
  </g>

  <!-- Other fleet vehicles on the map -->
  <g id="mapcars">
    <g transform="translate(345 300)">
      <circle r="38" fill="#00AD4E" opacity="0.12"/>
      <g filter="url(#shs)"><circle r="24" fill="#FFFFFF"/></g>
      <circle r="24" fill="none" stroke="#00AD4E" stroke-width="4"/>
      <g transform="translate(-18 -8) scale(0.13)" fill="#00AD4E">
        <path d="M10 70 C10 52 22 46 40 44 L80 40 L120 10 C128 4 136 2 146 2 L200 2 C212 2 220 6 228 14 L256 40 C270 42 280 50 280 62 L280 78 C280 84 276 88 270 88 L18 88 C12 88 10 84 10 78 Z"/>
        <circle cx="70" cy="92" r="30"/><circle cx="220" cy="92" r="30"/>
      </g>
    </g>
    <g transform="translate(950 572)">
      <circle r="38" fill="#111111" opacity="0.08"/>
      <g filter="url(#shs)"><circle r="24" fill="#111111"/></g>
      <g transform="translate(-18 -8) scale(0.13)" fill="#FFFFFF">
        <path d="M10 70 C10 52 22 46 40 44 L80 40 L120 10 C128 4 136 2 146 2 L200 2 C212 2 220 6 228 14 L256 40 C270 42 280 50 280 62 L280 78 C280 84 276 88 270 88 L18 88 C12 88 10 84 10 78 Z"/>
        <circle cx="70" cy="92" r="30"/><circle cx="220" cy="92" r="30"/>
      </g>
    </g>
    <g transform="translate(538 830)">
      <circle r="38" fill="#00AD4E" opacity="0.12"/>
      <g filter="url(#shs)"><circle r="24" fill="#FFFFFF"/></g>
      <circle r="24" fill="none" stroke="#00AD4E" stroke-width="4"/>
      <g transform="translate(-18 -8) scale(0.13)" fill="#00AD4E">
        <path d="M10 70 C10 52 22 46 40 44 L80 40 L120 10 C128 4 136 2 146 2 L200 2 C212 2 220 6 228 14 L256 40 C270 42 280 50 280 62 L280 78 C280 84 276 88 270 88 L18 88 C12 88 10 84 10 78 Z"/>
        <circle cx="70" cy="92" r="30"/><circle cx="220" cy="92" r="30"/>
      </g>
    </g>
    <g transform="translate(200 410)">
      <circle r="38" fill="#111111" opacity="0.08"/>
      <g filter="url(#shs)"><circle r="24" fill="#111111"/></g>
      <g transform="translate(-18 -8) scale(0.13)" fill="#FFFFFF">
        <path d="M10 70 C10 52 22 46 40 44 L80 40 L120 10 C128 4 136 2 146 2 L200 2 C212 2 220 6 228 14 L256 40 C270 42 280 50 280 62 L280 78 C280 84 276 88 270 88 L18 88 C12 88 10 84 10 78 Z"/>
        <circle cx="70" cy="92" r="30"/><circle cx="220" cy="92" r="30"/>
      </g>
    </g>
  </g>

  <!-- Point A -->
  <circle cx="230" cy="820" r="34" fill="#111111" opacity="0.15"/>
  <circle cx="230" cy="820" r="20" fill="#111111"/>
  <circle cx="230" cy="820" r="8" fill="#FFFFFF"/>

  <!-- Stop marker with pulse -->
  <circle cx="470" cy="640" r="46" fill="none" stroke="#00AD4E" stroke-width="3" opacity="0.25"/>
  <circle cx="470" cy="640" r="32" fill="#00AD4E" opacity="0.18"/>
  <circle cx="470" cy="640" r="16" fill="#00AD4E" stroke="#FFFFFF" stroke-width="5"/>

  <!-- Dwell-time bubble -->
  <g filter="url(#shs)">
    <rect x="300" y="470" width="220" height="104" rx="22" fill="#FFFFFF"/>
    <path d="M440 572 L462 600 L470 572 Z" fill="#FFFFFF"/>
  </g>
  <!-- clock -->
  <circle cx="356" cy="522" r="30" fill="#E6F7EE"/>
  <circle cx="356" cy="522" r="20" fill="none" stroke="#00AD4E" stroke-width="5"/>
  <path d="M356 510 L356 523 L366 530" stroke="#00AD4E" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- dwell bar -->
  <rect x="402" y="500" width="96" height="12" rx="6" fill="#E8ECEB"/>
  <rect x="402" y="500" width="64" height="12" rx="6" fill="#00AD4E"/>
  <rect x="402" y="526" width="70" height="10" rx="5" fill="#DDE3E1"/>
  <rect x="402" y="546" width="44" height="10" rx="5" fill="#DDE3E1"/>

  <!-- Vehicle on route (heading badge) -->
  <g transform="translate(730 470)">
    <circle r="52" fill="#00AD4E" opacity="0.15"/>
    <g filter="url(#shs)"><circle r="36" fill="#00AD4E"/></g>
    <circle r="36" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <!-- small truck glyph -->
    <g fill="#FFFFFF" transform="translate(-20 -12)">
      <rect x="0" y="0" width="24" height="18" rx="3"/>
      <path d="M26 5 L34 5 L40 12 L40 18 L26 18 Z"/>
      <circle cx="8" cy="22" r="5" fill="#FFFFFF" stroke="#00AD4E" stroke-width="3"/>
      <circle cx="32" cy="22" r="5" fill="#FFFFFF" stroke="#00AD4E" stroke-width="3"/>
    </g>
  </g>

  <!-- Point B pin -->
  <g transform="translate(900 290)">
    <ellipse cx="0" cy="4" rx="22" ry="7" fill="#111111" opacity="0.18"/>
    <g filter="url(#shs)">
      <path d="M0 0 C-12 -22 -38 -40 -38 -70 C-38 -92 -21 -108 0 -108 C21 -108 38 -92 38 -70 C38 -40 12 -22 0 0 Z" fill="#00AD4E"/>
    </g>
    <circle cx="0" cy="-70" r="15" fill="#FFFFFF"/>
  </g>

  <!-- A→B time chip -->
  <g filter="url(#shs)">
    <rect x="600" y="300" width="196" height="64" rx="32" fill="#FFFFFF"/>
  </g>
  <circle cx="632" cy="332" r="9" fill="#111111"/>
  <path d="M648 332 L700 332" stroke="#00AD4E" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 11"/>
  <path d="M752 312 C744 304 736 304 736 318 C736 334 752 350 752 350 C752 350 768 334 768 318 C768 304 760 304 752 312 Z" fill="none"/>
  <g transform="translate(752 342)">
    <path d="M0 0 C-5 -8 -14 -14 -14 -24 C-14 -32 -8 -38 0 -38 C8 -38 14 -32 14 -24 C14 -14 5 -8 0 0 Z" fill="#00AD4E"/>
    <circle cx="0" cy="-24" r="5" fill="#FFFFFF"/>
  </g>

  <!-- ============ DASHBOARD PANEL ============ -->
  <g filter="url(#sh)">
    <rect x="1080" y="200" width="400" height="640" rx="32" fill="#FFFFFF"/>
  </g>
  <!-- header -->
  <circle cx="1136" cy="258" r="26" fill="#00AD4E"/>
  <g transform="translate(1136 270)">
    <path d="M0 0 C-4 -6 -11 -11 -11 -18 C-11 -25 -6 -30 0 -30 C6 -30 11 -25 11 -18 C11 -11 4 -6 0 0 Z" fill="#FFFFFF"/>
    <circle cx="0" cy="-18" r="4" fill="#00AD4E"/>
  </g>
  <rect x="1180" y="240" width="150" height="14" rx="7" fill="#212529" opacity="0.85"/>
  <rect x="1180" y="264" width="100" height="10" rx="5" fill="#DDE3E1"/>
  <circle cx="1440" cy="258" r="8" fill="#00AD4E"/>
  <circle cx="1440" cy="258" r="15" fill="none" stroke="#00AD4E" stroke-width="3" opacity="0.3"/>

  <line x1="1110" y1="310" x2="1450" y2="310" stroke="#EEF1F0" stroke-width="2"/>

  <!-- stopwatch + ring -->
  <g transform="translate(1180 400)">
    <circle r="58" fill="none" stroke="#E8ECEB" stroke-width="12"/>
    <circle r="58" fill="none" stroke="#00AD4E" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="255 365" transform="rotate(-90)"/>
    <circle r="28" fill="#E6F7EE"/>
    <circle cy="2" r="16" fill="none" stroke="#111111" stroke-width="4"/>
    <rect x="-5" y="-22" width="10" height="6" rx="2" fill="#111111"/>
    <path d="M0 2 L0 -7" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
  </g>
  <rect x="1270" y="370" width="170" height="16" rx="8" fill="#212529" opacity="0.85"/>
  <rect x="1270" y="398" width="120" height="10" rx="5" fill="#DDE3E1"/>
  <rect x="1270" y="420" width="140" height="10" rx="5" fill="#DDE3E1"/>

  <line x1="1110" y1="490" x2="1450" y2="490" stroke="#EEF1F0" stroke-width="2"/>

  <!-- utilisation bars -->
  <g>
    <rect x="1120" y="600" width="34" height="60" rx="8" fill="#CDEFDB"/>
    <rect x="1172" y="570" width="34" height="90" rx="8" fill="#CDEFDB"/>
    <rect x="1224" y="545" width="34" height="115" rx="8" fill="#00AD4E"/>
    <rect x="1276" y="585" width="34" height="75" rx="8" fill="#CDEFDB"/>
    <rect x="1328" y="525" width="34" height="135" rx="8" fill="#00AD4E"/>
    <rect x="1380" y="555" width="34" height="105" rx="8" fill="#CDEFDB"/>
    <line x1="1110" y1="662" x2="1450" y2="662" stroke="#E1E6E4" stroke-width="2"/>
    <path d="M1137 590 L1189 560 L1241 535 L1293 570 L1345 512 L1397 540" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1345" cy="512" r="7" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>
  </g>

  <!-- route timeline -->
  <line x1="1130" y1="712" x2="1130" y2="800" stroke="#00AD4E" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round"/>
  <circle cx="1130" cy="712" r="10" fill="#111111"/>
  <circle cx="1130" cy="756" r="10" fill="#00AD4E" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="1130" cy="800" r="10" fill="#FFFFFF" stroke="#00AD4E" stroke-width="5"/>
  <rect x="1160" y="706" width="150" height="12" rx="6" fill="#DDE3E1"/>
  <rect x="1160" y="750" width="110" height="12" rx="6" fill="#DDE3E1"/>
  <rect x="1160" y="794" width="170" height="12" rx="6" fill="#DDE3E1"/>
  <rect x="1380" y="704" width="60" height="16" rx="8" fill="#E6F7EE"/>
  <rect x="1380" y="748" width="60" height="16" rx="8" fill="#E6F7EE"/>
  <rect x="1380" y="792" width="60" height="16" rx="8" fill="#E6F7EE"/>

  <!-- ============ FOREGROUND ROAD + TRUCK ============ -->
  <rect x="0" y="1080" width="1600" height="120" fill="#111111" opacity="0.06"/>
  <path d="M0 1080 L1600 1080" stroke="#111111" stroke-opacity="0.12" stroke-width="3"/>
  <path d="M60 1140 L1560 1140" stroke="#FFFFFF" stroke-width="8" stroke-dasharray="60 40" stroke-linecap="round"/>

  <!-- speed lines -->
  <g stroke="#00AD4E" stroke-width="6" stroke-linecap="round" opacity="0.35">
    <path d="M860 960 L960 960"/>
    <path d="M820 1000 L950 1000"/>
    <path d="M880 1040 L960 1040"/>
  </g>

  <!-- foreground cars -->
  <g stroke="#00AD4E" stroke-width="6" stroke-linecap="round" opacity="0.3">
    <path d="M60 1030 L130 1030"/><path d="M40 1060 L120 1060"/>
    <path d="M420 1030 L490 1030"/><path d="M400 1060 L480 1060"/>
  </g>
  <!-- white sedan -->
  <g transform="translate(150 997) scale(0.9)">
    <ellipse cx="145" cy="114" rx="150" ry="10" fill="#111111" opacity="0.12"/>
    <path d="M10 70 C10 52 22 46 40 44 L80 40 L120 10 C128 4 136 2 146 2 L200 2 C212 2 220 6 228 14 L256 40 C270 42 280 50 280 62 L280 78 C280 84 276 88 270 88 L18 88 C12 88 10 84 10 78 Z" fill="#FFFFFF" stroke="#E1E6E4" stroke-width="3"/>
    <path d="M92 40 L128 14 C132 11 136 10 142 10 L168 10 L168 40 Z" fill="#DCEBF7"/>
    <path d="M178 10 L200 10 C208 10 214 13 220 19 L240 40 L178 40 Z" fill="#DCEBF7"/>
    <rect x="10" y="62" width="270" height="10" fill="#00AD4E"/>
    <rect x="186" y="50" width="18" height="5" rx="2.5" fill="#C9D1CE"/>
    <rect x="268" y="50" width="12" height="9" rx="3" fill="#FFE27A"/>
    <circle cx="70" cy="88" r="26" fill="#111111"/><circle cx="70" cy="88" r="11" fill="#E8ECEB"/>
    <circle cx="220" cy="88" r="26" fill="#111111"/><circle cx="220" cy="88" r="11" fill="#E8ECEB"/>
    <rect x="140" y="-6" width="22" height="9" rx="3" fill="#111111"/>
    <circle cx="156" cy="-1.5" r="2.5" fill="#00AD4E"/>
  </g>
  <!-- green car -->
  <g transform="translate(510 997) scale(0.9)">
    <ellipse cx="145" cy="114" rx="150" ry="10" fill="#111111" opacity="0.12"/>
    <path d="M10 70 C10 52 22 46 40 44 L80 40 L120 10 C128 4 136 2 146 2 L200 2 C212 2 220 6 228 14 L256 40 C270 42 280 50 280 62 L280 78 C280 84 276 88 270 88 L18 88 C12 88 10 84 10 78 Z" fill="#00AD4E"/>
    <path d="M92 40 L128 14 C132 11 136 10 142 10 L168 10 L168 40 Z" fill="#DCEBF7"/>
    <path d="M178 10 L200 10 C208 10 214 13 220 19 L240 40 L178 40 Z" fill="#DCEBF7"/>
    <path d="M134 18 L150 18 L140 34 L128 34 Z" fill="#FFFFFF" opacity="0.6"/>
    <rect x="186" y="50" width="18" height="5" rx="2.5" fill="#FFFFFF" opacity="0.8"/>
    <rect x="268" y="50" width="12" height="9" rx="3" fill="#FFE27A"/>
    <circle cx="70" cy="88" r="26" fill="#111111"/><circle cx="70" cy="88" r="11" fill="#E8ECEB"/>
    <circle cx="220" cy="88" r="26" fill="#111111"/><circle cx="220" cy="88" r="11" fill="#E8ECEB"/>
    <rect x="140" y="-6" width="22" height="9" rx="3" fill="#111111"/>
    <circle cx="156" cy="-1.5" r="2.5" fill="#00AD4E"/>
  </g>

  <g>
    <ellipse cx="1240" cy="1086" rx="290" ry="16" fill="#111111" opacity="0.12"/>
    <!-- cargo box -->
    <rect x="990" y="890" width="330" height="168" rx="14" fill="#FFFFFF" stroke="#E1E6E4" stroke-width="3"/>
    <rect x="990" y="1010" width="330" height="22" fill="#00AD4E"/>
    <rect x="1020" y="925" width="70" height="8" rx="4" fill="#00AD4E" opacity="0.5"/>
    <!-- e-seal style door hardware hint -->
    <rect x="1000" y="940" width="10" height="56" rx="3" fill="#C9D1CE"/>
    <!-- chassis -->
    <rect x="990" y="1050" width="460" height="16" rx="6" fill="#111111"/>
    <!-- cab -->
    <path d="M1330 930 L1410 930 C1424 930 1434 936 1442 948 L1478 1000 C1484 1008 1486 1016 1486 1026 L1486 1058 L1330 1058 Z" fill="#00AD4E"/>
    <path d="M1360 948 L1408 948 C1414 948 1418 951 1421 955 L1450 998 L1360 998 Z" fill="#DCEBF7"/>
    <path d="M1372 958 L1392 958 L1380 988 L1366 988 Z" fill="#FFFFFF" opacity="0.6"/>
    <rect x="1340" y="1012" width="28" height="6" rx="3" fill="#FFFFFF" opacity="0.8"/>
    <rect x="1474" y="1030" width="16" height="12" rx="3" fill="#FFE27A"/>
    <!-- wheels -->
    <g>
      <circle cx="1070" cy="1066" r="36" fill="#111111"/>
      <circle cx="1070" cy="1066" r="15" fill="#E8ECEB"/>
      <circle cx="1150" cy="1066" r="36" fill="#111111"/>
      <circle cx="1150" cy="1066" r="15" fill="#E8ECEB"/>
      <circle cx="1410" cy="1066" r="36" fill="#111111"/>
      <circle cx="1410" cy="1066" r="15" fill="#E8ECEB"/>
    </g>
    <!-- GPS unit + signal -->
    <rect x="1392" y="914" width="30" height="16" rx="5" fill="#111111"/>
    <circle cx="1415" cy="922" r="3" fill="#00AD4E"/>
    <g fill="none" stroke="#00AD4E" stroke-width="6" stroke-linecap="round">
      <path d="M1390 890 A30 30 0 0 1 1424 890"/>
      <path d="M1376 870 A52 52 0 0 1 1438 870" opacity="0.6"/>
      <path d="M1362 850 A74 74 0 0 1 1452 850" opacity="0.3"/>
