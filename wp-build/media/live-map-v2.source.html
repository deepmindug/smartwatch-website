[[760,330,120,62,-12],[640,600,70,40,10],[300,330,90,55,20],[1060,420,85,50,-20],[200,860,110,60,8],[1180,180,95,48,0],[880,410,60,36,15]].forEach(([x,y,a,b,r])=>el('ellipse',{cx:x,cy:y,rx:a,ry:b,fill:'#CFE7C6',transform:'rotate('+r+' '+x+' '+y+')'},land));
